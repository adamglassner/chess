<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Lora;src:url(../web/fonts/Lora-Variable.ttf);font-weight:400 700}
@font-face{font-family:Lora;font-style:italic;src:url(../web/fonts/Lora-Italic-Variable.ttf);font-weight:400 700}
body{margin:0;background:#222}</style></head><body>
<script src="../web/core.js"></script><script src="../web/art.js"></script><script>
window.out={};
(async()=>{for(const f of ['600 40px Lora','italic 30px Lora','700 40px Lora'])await document.fonts.load(f);
const D=IR.draw;
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return [c,c.getContext('2d')]};
out.icon=ART.icon(1024).toDataURL();
// desk + angled board helper
function desk(x,W,H){const sc=document.createElement('canvas');ART.scene(sc,W,H,1,null);x.drawImage(sc,0,0,W,H);}
function boardAt(x,cx,cy,size,rot,theme,place){x.save();x.translate(cx,cy);x.rotate(rot);
 const fr=ART.boardFrame(theme,size*1.11,size,false);x.shadowColor='rgba(0,0,0,.6)';x.shadowBlur=40;x.shadowOffsetY=18;
 x.drawImage(fr,-size*1.11/2,-size*1.11/2);x.shadowBlur=0;x.drawImage(ART.boardSurface(theme,size),-size/2,-size/2);
 const s=size/8;place.forEach(([p,f,r])=>x.drawImage(ART.piece(p,s*2),-size/2+f*s,-size/2+(7-r)*s,s,s));x.restore();}
const midgame=[[4,0,0],[6,6,0],[1,0,1],[1,1,1],[1,5,1],[1,6,1],[1,7,1],[3,1,2],[2,5,2],[1,3,3],[1,4,3],[5,3,4],
 [-4,3,7],[-6,6,7],[-1,0,6],[-1,1,6],[-1,5,6],[-1,6,6],[-1,7,6],[-3,4,6],[-2,2,5],[-1,4,4],[-5,6,4],[-4,5,7]];
// cover 480x600 (render 960x1200, downscale later)
{const W=960,H=1200,[c,x]=mk(W,H);desk(x,W,H);
 boardAt(x,W*.55,H*.86,860,-.16,'walnut',midgame);
 const v=x.createLinearGradient(0,0,0,H);v.addColorStop(0,'rgba(10,4,2,.85)');v.addColorStop(.45,'rgba(10,4,2,.55)');v.addColorStop(.6,'rgba(10,4,2,.15)');v.addColorStop(1,'rgba(0,0,0,.25)');x.fillStyle=v;x.fillRect(0,0,W,H);
 x.save();x.shadowColor='rgba(0,0,0,.7)';x.shadowBlur=40;x.shadowOffsetY=20;x.drawImage(ART.piece(6,640),W*.02,H*.38,640,640);x.drawImage(ART.piece(-5,560),W*.42,H*.46,560,560);x.restore();
 x.fillStyle=D.rad(x,W*.3,H*.12,20,W*.9,['rgba(255,200,120,.25)','rgba(0,0,0,0)']);x.fillRect(0,0,W,H);
 x.textAlign='center';x.fillStyle='#e2bd6a';x.font='600 34px Lora';x.letterSpacing='12px';x.fillText('RAVENSCROFT LIBRARY',W/2,138);
 x.letterSpacing='14px';x.font='600 220px Lora';x.shadowColor='rgba(0,0,0,.8)';x.shadowBlur=24;x.fillStyle='#f8ead0';x.fillText('Chess',W/2+7,340);
 x.shadowBlur=0;x.strokeStyle='#c9a24c';x.lineWidth=3;x.beginPath();x.moveTo(W/2-230,384);x.lineTo(W/2+230,384);x.stroke();
 x.letterSpacing='0px';x.font='italic 40px Lora';x.fillStyle='#ead6ae';x.fillText('six opponents · one quiet evening',W/2,440);
 out.cover=c.toDataURL('image/jpeg',.92);}
// hero 1800x630: art to the right, left kept dark for the launcher's text
{const W=1800,H=630,[c,x]=mk(W,H);desk(x,W,H);
 boardAt(x,W*.7,H*.62,900,-.22,'walnut',midgame);
 const g=x.createLinearGradient(0,0,W,0);g.addColorStop(0,'rgba(12,5,2,.96)');g.addColorStop(.36,'rgba(12,5,2,.78)');g.addColorStop(.55,'rgba(12,5,2,.15)');g.addColorStop(1,'rgba(0,0,0,.1)');x.fillStyle=g;x.fillRect(0,0,W,H);
 x.save();x.shadowColor='rgba(0,0,0,.7)';x.shadowBlur=30;x.shadowOffsetY=16;x.drawImage(ART.piece(-6,520),W*.66,H*.02,520,520);x.drawImage(ART.piece(2,430),W*.5,H*.24,430,430);x.restore();
 x.fillStyle=D.rad(x,W*.62,H*.1,20,W*.6,['rgba(255,200,120,.18)','rgba(0,0,0,0)']);x.fillRect(0,0,W,H);
 out.hero=c.toDataURL('image/jpeg',.92);}
document.title='ready';})();
</script></body></html>
