<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Lora;src:url(../web/fonts/Lora-Variable.ttf)}
body{margin:0;background:#333}</style></head><body>
<script src="../web/core.js"></script><script src="../web/art.js"></script><script>
(async()=>{await document.fonts.load('600 30px Lora');
const W=1800,H=1150,[c,x]=[document.createElement('canvas'),null];c.width=W;c.height=H;const g=c.getContext('2d');document.body.appendChild(c);
g.fillStyle='#2a1a10';g.fillRect(0,0,W,H);
const S=210;[6,5,4,3,2,1].forEach((p,i)=>{g.fillStyle=(i%2)?'#7b4a2a':'#e6c896';g.fillRect(20+i*S,20,S,S);g.drawImage(ART.piece(p,S),20+i*S,20);
 g.fillStyle=(i%2)?'#e6c896':'#7b4a2a';g.fillRect(20+i*S,20+S,S,S);g.drawImage(ART.piece(-p,S),20+i*S,20+S);});
const fr=ART.boardFrame('walnut',620,540,false);g.drawImage(fr,20,470);g.drawImage(ART.boardSurface('walnut',540),60,510);
const st=[[4,0,4,0,6,0,0,4],[1,1,1,0,0,1,1,1]];
['R','N','B','Q','K','B','N','R'].forEach((t,f)=>{const v=' PNBRQK'.indexOf(t);g.drawImage(ART.piece(v,67.5),60+f*67.5,510+7*67.5);g.drawImage(ART.piece(1,67.5),60+f*67.5,510+6*67.5);g.drawImage(ART.piece(-v,67.5),60+f*67.5,510);g.drawImage(ART.piece(-1,67.5),60+f*67.5,510+67.5);});
g.drawImage(ART.icon(380),700,480);
ART.FOLKS.forEach((f,i)=>g.drawImage(ART.avatar(f,180),1100+(i%3)*200,480+Math.floor(i/3)*200));
g.drawImage(ART.boardSurface('marble',260),1300,880);g.drawImage(ART.boardSurface('club',260),1100-60,880);
document.title='ready';})();
</script></body></html>
