<!doctype html><html><body><script src="../web/core.js"></script><script src="../web/music.js"></script><script>
window.res={};
(async()=>{
 const tunes=MUSIC.tunes();
 for (const tune of tunes){
  const SR=22050, LEN=40;
  window.AudioContext=function(){return new OfflineAudioContext(2,SR*LEN,SR)};
  const a=new IR.Audio({music:true,sfx:true,vol:60}); a.ensure(); a.instruments=MUSIC.instruments; a.music.gain.value=a.vol();
  const spb=60/tune.bpm; for(const e of tune.events){const t=.2+e.t*spb; if(t>LEN-4)break; a.play(e,t,spb);}
  const buf=await a.ac.startRendering(); const d=buf.getChannelData(0); let pk=0,ss=0; for(const v of d){pk=Math.max(pk,Math.abs(v));ss+=v*v}
  res[tune.name]={peak:+pk.toFixed(3),rms:+Math.sqrt(ss/d.length).toFixed(4)};
 }
 const SR=22050; window.AudioContext=function(){return new OfflineAudioContext(2,SR*4,SR)};
 for(const k of ['move','capture','castle','check','promote','win','lose','draw','click','pick','hint','start','illegal','tick']){
  const a=new IR.Audio({music:false,sfx:true,vol:60}); a.ensure(); Object.defineProperty(a.ac,'state',{get:()=> 'running'}); a.setVol();
  MUSIC.sfx(a)[k](); const buf=await a.ac.startRendering(); const d=buf.getChannelData(0); let pk=0; for(const v of d)pk=Math.max(pk,Math.abs(v)); res['sfx:'+k]=+pk.toFixed(3);
 }
 document.title='ready';})();
</script></body></html>
